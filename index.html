<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Nails Worms</title>
</head>
<body>

  <div id="header"></div>
  <div id="main"></div>
  <div id="footer"></div>

  <script>
    // Load header
    fetch('header.html')
      .then(res => res.text())
      .then(data => document.getElementById('header').innerHTML = data);

    // Load main
    fetch('main.html')
      .then(res => res.text())
      .then(data => document.getElementById('main').innerHTML = data);

    // Load footer
    fetch('footer.html')
      .then(res => res.text())
      .then(data => document.getElementById('footer').innerHTML = data);
  </script>
  //nut book
<a href="https://kingnailsworms.setmore.com?utm_source=qr-code&utm_medium=more-share-bp"
   class="floating-book-btn"
   target="_blank"
   rel="noopener noreferrer">
  <span class="book-icon">📅</span>
  <span class="book-text">Book</span>
</a>

<style>
  .floating-book-btn {
    position: fixed;
    right: 20px;
    bottom: 40px;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: #c98593;
    color: #ffffff;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    z-index: 9999;
    transition: transform 0.25s ease, opacity 0.25s ease, background 0.25s ease;
    font-family: Arial, sans-serif;
  }

  .floating-book-btn:hover {
    transform: translateY(-3px) scale(1.03);
    background: #b97382;
  }

  .book-icon {
    font-size: 26px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .book-text {
    font-size: 15px;
    line-height: 1;
    font-weight: 500;
  }

  @media (max-width: 768px) {
    .floating-book-btn {
      right: 14px;
      bottom: 110px;
      width: 74px;
      height: 74px;
    }

    .book-icon {
      font-size: 24px;
    }

    .book-text {
      font-size: 14px;
    }
  }
</style>
</body>
</html>
